# ===========================
# 애플리케이션 기본 설정
# ===========================
spring.application.name=devlink

# ===========================
# PostgreSQL 데이터베이스
# ===========================
spring.datasource.url=jdbc:postgresql://34.158.219.4:5432/devlink
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=devlink
spring.datasource.password=devlink1234

# ===========================
# JPA 설정
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===========================
# 세션 설정 (Spring Security)
# ===========================
server.servlet.session.timeout=3600s

# ===========================
# Swagger 설정
# ===========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ===========================
# 이미지 업로드 설정
# ===========================
file.local.path=/tmp/devlink/images/
file.upload.dir=file:///tmp/devlink/images/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===========================
# 가천대 포털 URL 설정
# ===========================
portal.main=https://portal.gachon.ac.kr/
portal.sso.base=https://sso.gachon.ac.kr
portal.home=https://portal.gachon.ac.kr/p/S00/